name: Reusable Node pipeline

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
      working-directory:
        required: false
        type: string
        default: .
      install-command:
        required: false
        type: string
        default: npm ci
      test-command:
        required: false
        type: string
        default: npm test
      build-command:
        required: false
        type: string
        default: npm run build
      cache-dependency-path:
        required: false
        type: string
        default: package-lock.json
      artifact-name-prefix:
        required: false
        type: string
        default: node-pipeline
      artifact-retention-days:
        required: false
        type: number
        default: 14
    outputs:
      node-version:
        value: ${{ jobs.pipeline.outputs.node-version }}
      test-status:
        value: ${{ jobs.pipeline.outputs.test-status }}
      build-artifact-name:
        value: ${{ jobs.pipeline.outputs.build-artifact-name }}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.meta.outputs.node-version }}
      test-status: ${{ steps.tests.outcome }}
      build-artifact-name: ${{ steps.meta.outputs.build-artifact-name }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ format('{0}/{1}', inputs.working-directory, inputs.cache-dependency-path) }}

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ inputs.node-version }}-${{ hashFiles(format('{0}/{1}', inputs.working-directory, inputs.cache-dependency-path)) }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ inputs.node-version }}-

      - name: Prepare artifact folders
        run: |
          mkdir -p logs reports dist

      - name: Record metadata
        id: meta
        run: |
          echo "node-version=${{ inputs.node-version }}" >> "$GITHUB_OUTPUT"
          echo "build-artifact-name=${{ inputs.artifact-name-prefix }}-${{ inputs.node-version }}-build" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          eval "${{ inputs.install-command }}" 2>&1 | tee logs/install.log

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          eval "${{ inputs.test-command }}" 2>&1 | tee logs/test.log

      - name: Write test summary
        if: always()
        run: |
          printf 'node-version=%s\n' '${{ inputs.node-version }}' > reports/test-summary.txt
          printf 'test-command=%s\n' '${{ inputs.test-command }}' >> reports/test-summary.txt
          printf 'result=%s\n' '${{ steps.tests.outcome }}' >> reports/test-summary.txt

      - name: Run build
        id: build
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        run: |
          eval "${{ inputs.build-command }}" 2>&1 | tee logs/build.log

      - name: Write run summary
        if: always()
        run: |
          {
            echo "Node version: ${{ inputs.node-version }}"
            echo "Install command: ${{ inputs.install-command }}"
            echo "Test status: ${{ steps.tests.outcome }}"
            echo "Build status: ${{ steps.build.outcome }}"
          } > reports/run-summary.txt

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.build-artifact-name }}
          path: dist
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name-prefix }}-${{ inputs.node-version }}-tests
          path: reports
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name-prefix }}-${{ inputs.node-version }}-logs
          path: logs
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: warn

      - name: Fail when reusable workflow checks fail
        if: always()
        run: |
          if [[ "${{ steps.tests.outcome }}" != "success" ]]; then
            exit 1
          fi

          if [[ "${{ steps.build.outcome }}" != "success" ]]; then
            exit 1
          fi