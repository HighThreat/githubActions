name: Test Branch Normalizer Action

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Consume the action from the local workspace directory
      - name: Validate and Normalize Branch Name
        id: normalize_branch
        uses: ./lab6 # Points to the lab6 directory (where action.yml is located)
        with:
          branch-name: ${{ github.head_ref || github.ref_name }}
          allowed-prefixes: 'feature/,bugfix/,hotfix/,release/,main,master,develop'
          max-length: '30'
          fail-on-invalid: 'false' # Set to false to let downstream steps print diagnostics

      # 2. Consume the outputs generated by the action
      - name: Print Action Outputs
        run: |
          echo "========================================="
          echo "Is branch name valid? : ${{ steps.normalize_branch.outputs.is-valid }}"
          echo "Detected Branch Type  : ${{ steps.normalize_branch.outputs.branch-type }}"
          echo "Generated Tag Name    : ${{ steps.normalize_branch.outputs.normalized-tag }}"
          echo "Validation Details    : ${{ steps.normalize_branch.outputs.validation-message }}"
          echo "========================================="

      # 3. Conditional step example (e.g. build Docker image only on valid branch tags)
      - name: Build & Publish Mock Artifacts
        if: steps.normalize_branch.outputs.is-valid == 'true'
        run: |
          echo "Branch is valid! Building Docker image..."
          echo "docker build -t my-app:${{ steps.normalize_branch.outputs.normalized-tag }} ."
          echo "docker push my-app:${{ steps.normalize_branch.outputs.normalized-tag }}"

      # 4. Control error check (e.g., fail workflow after diagnostics if name was invalid)
      - name: Enforce Branch Naming Policy
        if: steps.normalize_branch.outputs.is-valid == 'false'
        run: |
          echo "::error::Branch name violates naming convention! Allowed patterns: feature/*, bugfix/*, hotfix/*, release/*, main, master, develop."
          exit 1
