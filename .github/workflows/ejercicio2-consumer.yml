name: Laboratorio 2 - consumidor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  node-18:
    uses: ./.github/workflows/reusable-node-pipeline.yml
    with:
      node-version: '18'
      working-directory: .
      install-command: npm ci
      test-command: npm test
      build-command: npm run build
      cache-dependency-path: package-lock.json
      artifact-name-prefix: lab2-node18
      artifact-retention-days: 7

  node-20:
    uses: ./.github/workflows/reusable-node-pipeline.yml
    with:
      node-version: '20'
      working-directory: .
      install-command: npm ci
      test-command: npm test
      build-command: npm run build
      cache-dependency-path: package-lock.json
      artifact-name-prefix: lab2-node20
      artifact-retention-days: 7

  resumen:
    runs-on: ubuntu-latest
    needs:
      - node-18
      - node-20
    steps:
      - name: Mostrar outputs reutilizables
        run: |
          echo "Node 18 => ${{ needs.node-18.outputs.node-version }} / ${{ needs.node-18.outputs.test-status }} / ${{ needs.node-18.outputs.build-artifact-name }}"
          echo "Node 20 => ${{ needs.node-20.outputs.node-version }} / ${{ needs.node-20.outputs.test-status }} / ${{ needs.node-20.outputs.build-artifact-name }}"

      - name: Lógica adicional propia
        run: |
          printf 'Resumen del laboratorio\n' > resumen.txt
          printf 'Versiones verificadas: 18 y 20\n' >> resumen.txt
          cat resumen.txt