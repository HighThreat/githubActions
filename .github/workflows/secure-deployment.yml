name: Secure Deployment Lab
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      demonstrate_permission_failure:
        description: 'Run the permission failure demo job'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  APP_NAME: ${{ vars.APP_NAME }}

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: Validate tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  permission_probe:
    name: Permission failure demo
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.demonstrate_permission_failure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Attempt write with read-only token
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              description: 'This should fail because the workflow only has contents: read.'
            })

  deploy_staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs:
      - build
      - test
    if: github.ref == 'refs/heads/main' && needs.test.result == 'success'
    environment:
      name: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Simulate staging deploy without leaking secrets
        env:
          TARGET_ENV: staging
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          test -n "$APP_NAME"
          test -n "$DEPLOY_TOKEN"
          test -n "$API_TOKEN"
          printf 'Deploying %s to %s\n' "$APP_NAME" "$TARGET_ENV"

  deploy_production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs:
      - build
      - test
      - deploy_staging
    if: github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.deploy_staging.result == 'success'
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Simulate production deploy without leaking secrets
        env:
          TARGET_ENV: production
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          test -n "$APP_NAME"
          test -n "$DEPLOY_TOKEN"
          test -n "$API_TOKEN"
          printf 'Deploying %s to %s\n' "$APP_NAME" "$TARGET_ENV"